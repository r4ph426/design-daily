name: Collect and publish the weekly edition

on:
  push:
    branches: [main]
  schedule:
    # Leave room for delayed Actions scheduling so the edition lands before 08:00.
    - cron: "17 1 * * 1-5"
      timezone: "Europe/Berlin"
    - cron: "17 7 * * 5"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      validate_only:
        description: Collect and validate real sources without saving, closing submissions or deploying
        type: boolean
        default: false

concurrency:
  group: design-daily-pages
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test crawler and security boundaries
        run: node --test tests/crawler.test.mjs tests/article-intake.test.mjs tests/security.test.mjs tests/weekly*.test.mjs tests/inspiration*.test.mjs

      - name: Collect evidence and update the weekly questions
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          GMAIL_QUERY: ${{ vars.GMAIL_QUERY || 'newer_than:7d -in:spam -in:trash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/weekly-crawl.mjs ${{ github.event_name == 'push' && '--bootstrap-only' || '' }} ${{ inputs.validate_only && '--dry-run' || '' }}

      - name: Save the generated edition
        if: ${{ !inputs.validate_only }}
        run: |
          git config user.name "design-daily bot"
          git config user.email "design-daily-bot@users.noreply.github.com"
          git add public/data data/weekly-inputs
          if ! git diff --cached --quiet; then
            git commit -m "Update the weekly edition"
            git push
          fi

      - name: Build the GitHub Pages site
        if: ${{ !inputs.validate_only }}
        env:
          VITE_ARTICLE_SUBMISSION_ENDPOINT: ${{ vars.ARTICLE_SUBMISSION_ENDPOINT }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: pnpm run build:pages

      - name: Configure GitHub Pages
        if: ${{ !inputs.validate_only }}
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        if: ${{ !inputs.validate_only }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

      - name: Deploy to GitHub Pages
        if: ${{ !inputs.validate_only }}
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Retain validation preview
        if: ${{ always() && inputs.validate_only }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-review-validation
          path: .private/weekly-review/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
